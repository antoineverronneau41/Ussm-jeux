<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>L'Homme Libre - Football IQ</title>

<style>

body{
    margin:0;
    background:#101820;
    font-family:Arial, sans-serif;
    color:white;
    text-align:center;
}

h1{
    margin-top:20px;
}

#interface{
    display:flex;
    justify-content:center;
    gap:40px;
    margin-top:20px;
}

#terrain{

    width:700px;
    height:420px;
    background:#2e8b57;
    border:5px solid white;
    position:relative;
    overflow:hidden;

}


.ligne{
    position:absolute;
    border:white solid 2px;
}

#centre{
    width:0;
    height:100%;
    left:50%;
    border-left:2px solid white;
}

.joueur{

    position:absolute;
    width:35px;
    height:35px;
    border-radius:50%;
    line-height:35px;
    font-weight:bold;
    cursor:pointer;
    transform:translate(-50%,-50%);
}


.bleu{
    background:#1976d2;
}

.rouge{
    background:#d32f2f;
}

.ball{
    box-shadow:0 0 15px yellow;
}


#infos{

width:250px;
background:#18232f;
padding:20px;
border-radius:10px;

}


button{

padding:12px 25px;
font-size:16px;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:20px;

}


#message{

font-size:20px;
margin-top:20px;

}

</style>

</head>


<body>


<h1>🧠 L'Homme Libre</h1>

<p>
Trouve le joueur qui permet de progresser.
</p>


<div id="interface">


<div id="terrain">

<div id="centre" class="ligne"></div>


</div>


<div id="infos">

<h2>Score</h2>

<div id="score">
0 XP
</div>


<h2>Temps</h2>

<div id="temps">
8
</div>


<button onclick="nouveauJeu()">
Nouvelle situation
</button>


</div>


</div>


<div id="message"></div>



<script>


let score=0;
let bonneReponse=5;
let timer;
let temps=8;



let situations=[

{
bonne:5,

joueurs:[

{id:8,x:50,y:55,e:"bleu",ball:true},
{id:5,x:50,y:72,e:"bleu"},
{id:7,x:80,y:40,e:"bleu"},
{id:11,x:20,y:40,e:"bleu"},
{id:6,x:52,y:45,e:"rouge"},
{id:9,x:70,y:30,e:"rouge"}

],

texte:
"Le joueur 5 est libre. Il offre une solution intérieure et peut éliminer une ligne."

},


{

bonne:11,

joueurs:[

{id:8,x:55,y:55,e:"bleu",ball:true},
{id:7,x:80,y:65,e:"bleu"},
{id:11,x:20,y:70,e:"bleu"},
{id:5,x:50,y:75,e:"bleu"},
{id:6,x:40,y:45,e:"rouge"},
{id:9,x:70,y:50,e:"rouge"}

],

texte:
"Le joueur 11 est libre car le côté opposé est disponible. Il permet un changement de côté."

}

];



function nouveauJeu(){

clearInterval(timer);

let s=situations[
Math.floor(Math.random()*situations.length)
];


bonneReponse=s.bonne;


document.getElementById("terrain").innerHTML=
'<div id="centre" class="ligne"></div>';



s.joueurs.forEach(j=>{


let div=document.createElement("div");


div.className=
"joueur "+j.e+
(j.ball?" ball":"");


div.innerHTML=j.id;


div.style.left=j.x+"%";
div.style.top=j.y+"%";


if(j.e=="bleu"){

div.onclick=function(){

verification(j.id,s.texte);

}

}


document.getElementById("terrain")
.appendChild(div);



});


temps=8;

document.getElementById("temps").innerHTML=temps;


timer=setInterval(()=>{

temps--;

document.getElementById("temps").innerHTML=temps;


if(temps<=0){

clearInterval(timer);

document.getElementById("message").innerHTML=
"⏱️ Temps écoulé. Observe l'espace avant de recevoir.";

}

},1000);



document.getElementById("message").innerHTML="";


}



function verification(id,texte){


clearInterval(timer);



if(id==bonneReponse){


score+=25;


document.getElementById("score")
.innerHTML=score+" XP";


document.getElementById("message")
.innerHTML=
"✅ Excellent choix !<br>"+texte;


}

else{


document.getElementById("message")
.innerHTML=
"❌ Mauvaise décision.<br>"+
"Regarde qui est réellement libre avant de jouer.";


}



}



nouveauJeu();


</script>


</body>
</html>
